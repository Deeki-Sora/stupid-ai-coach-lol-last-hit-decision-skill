<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOL 录像采样 / Video sampling</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
html body{background:#f4f1ea;color:#302c27;font:18px/1.8 'Times New Roman','Noto Serif SC',serif;margin:0}
body main{width:calc(100% - 48px);max-width:960px;margin:48px auto;padding:40px;background:#fffdf8;border:1px solid #d9d1c4;border-radius:16px;box-sizing:border-box}
main h1{font-size:30px;font-weight:600;margin:24px 0 16px;line-height:1.4}main p{margin:12px 0 28px}main label{display:block;margin:32px 0 12px;font-weight:600}
main input,main select,main button{font:inherit;box-sizing:border-box;padding:12px 16px;margin:0;border:1px solid #d9d1c4;border-radius:9px;max-width:100%;min-height:52px;color:#302c27}
main input,main select{background:#fff;width:100%}main #lang,main #step{width:auto;min-width:150px}
main .button-row{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0 32px}main button{background:#e7eee8;cursor:pointer;transition:background .15s,transform .15s}main button:hover{background:#d1e4d9;transform:translateY(-1px)}
main small{display:block;color:#756f66;margin:14px 0 24px}main #sample{display:block;background:#286356;color:#fff;margin-top:36px;padding:16px 24px;width:100%}main #chooseOutput{margin-top:16px}main #status{white-space:pre-wrap;margin-top:24px}main button:disabled{opacity:.5}
main .automation-choice{display:flex;align-items:flex-start;gap:14px;margin:32px 0 8px;padding:18px;border:1px solid #d9d1c4;border-radius:10px;background:#faf7f0}main .automation-choice input{width:22px;height:22px;min-height:22px;margin-top:5px;accent-color:#286356;flex:0 0 auto}main .automation-choice label{margin:0;font-weight:600}main #visionStatus{margin:8px 0 24px;padding-left:36px}
main input[hidden]{display:none!important}main input:focus,main select:focus,main button:focus-visible{outline:2px solid #b86543;outline-offset:3px}
@media(max-width:600px){body main{width:calc(100% - 24px);margin:16px auto;padding:24px}main h1{font-size:25px}main .button-row{gap:12px}main .button-row button{width:100%}}
dialog{width:min(840px,94vw);max-height:88vh;padding:28px;background:#fffdf8;border:1px solid #d9d1c4;border-radius:16px;overflow:auto;color:#302c27;box-sizing:border-box}dialog::backdrop{background:#302c2770}dialog h2{font-size:24px;margin:0 0 24px}dialog input,dialog select,dialog button{font:inherit;padding:12px 16px;min-height:52px;border:1px solid #d9d1c4;border-radius:9px;background:#fff;box-sizing:border-box}dialog input,dialog select{width:100%}dialog .button-row{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}#diskEntries{min-height:120px;max-height:38vh;overflow:auto;margin:24px 0;border:1px solid #ded7ca;border-radius:9px}#diskEntries button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;overflow-wrap:anywhere}#diskEntries button:hover{background:#e7eee8}#diskError{color:#9d412c}main #videoInfo{color:#286356;font-weight:600}main #status{overflow-wrap:anywhere}
</style>
<main><select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
<h1 data-en="Choose a replay and sample frames">选择录像并生成截图</h1>
<p data-en="Select a video or folder, choose a source-video interval and sampling rate, then open the annotation workbench.">先选择录像，再设定截取时间和采样间隔，生成截图后进入标注工作台。</p>
<label data-en="Video file or folder path">录像文件或文件夹路径</label><input id="path" placeholder="D:\videos\match.mp4">
<div class="button-row"><button id="file" data-en="Choose video">选择录像文件</button><button id="folder" data-en="Choose folder">选择文件夹</button><button id="list" data-en="Read path">读取路径</button></div>
<small data-en="Browse local disks to select the original video. No copying or uploading is required.">从磁盘浏览窗口直接选择原录像，无需复制或上传。</small>
<label data-en="Video">录像</label><select id="videos"></select><p id="videoInfo" role="status"></p>
<label data-en="Clip start (source-video time)">开始时间（视频时间）</label><input id="start" value="0" placeholder="01:00">
<label data-en="Clip end (source-video time)">结束时间（视频时间）</label><input id="end" placeholder="01:30">
<small data-en="Use seconds or MM:SS. These are video timestamps, not the in-game clock.">填写秒数或 MM:SS，指视频时间，不是游戏内时钟。</small>
<label data-en="Sampling interval (seconds)">采样间隔（秒）</label><select id="step"><option>0.1</option><option>0.2</option><option selected>0.3</option><option>0.4</option><option>0.5</option></select>
<div class="automation-choice"><input id="useYolo" type="checkbox"><label for="useYolo" data-en="Use local YOLO to identify and track units automatically">使用本地 YOLO 自动识别并追踪单位</label></div>
<small id="visionStatus" data-en="The workbench checks CUDA, dependencies, and bundled weights automatically. If unavailable or unchecked, it uses basic Track candidates.">工作台会自动检查 CUDA、依赖和仓库内权重；不可用或未勾选时使用基础 Track 候选。</small>
<label data-en="Output folder (a new subfolder is created automatically)">保存目录（自动建立新子文件夹）</label><input id="output"><small data-en="Screenshots and workspace default to the original video folder. You may choose another folder.">默认在原录像所在文件夹内建立工作区和截图文件夹，也可另选目录。</small>
<button id="chooseOutput" data-en="Browse output folder…">浏览并选择保存目录…</button>
<button disabled id="sample" data-en="Generate screenshots and open workbench">生成截图并进入工作台</button><p id="status" role="status"></p>
</main><dialog id="diskBrowser" aria-labelledby="diskTitle"><h2 id="diskTitle"></h2><select id="diskDrive" aria-label="Drive"></select><div class="button-row"><button id="diskUp" data-en="Parent folder">上一级</button></div><input id="diskPath" aria-label="Folder path"><div class="button-row"><button id="diskGo" data-en="Go to folder">进入目录</button></div><div id="diskEntries"></div><p id="diskError" role="status"></p><div class="button-row"><button id="diskChoose" data-en="Use this folder">选择当前文件夹</button><button id="diskClose" data-en="Cancel">取消</button></div></dialog><script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');
const en=()=>$('lang').value==='en',tr=(zh,english)=>en()?english:zh;
async function api(path,body){let r=await fetch(path+'?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':token},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});let d=await r.json();if(!r.ok)throw Error(d.error);return d}
let media=null,busy=false,metadataRequest=0,setupVision=null;
const labels=[...document.querySelectorAll('[data-en]')].map(n=>[n,n.textContent]);
function renderVision(){if(!setupVision)return;let v=setupVision;$('visionStatus').textContent=v.available?tr('已检测到 CUDA、YOLO、BoT-SORT 依赖和仓库权重；勾选后将直接用 GPU 自动标注。','CUDA, YOLO, BoT-SORT dependencies, and bundled weights are ready; enable this option for GPU annotation.') : tr('YOLO 当前不可用（缺少：','YOLO is unavailable (missing: ')+(v.missing||[]).join(', ')+tr('）。勾选后也会安全回退到基础 Track 候选。','). Enabling it will still fall back safely to basic Track candidates.')}
function language(){localStorage.setItem('lol-workbench-language',en()?'en':'zh');document.documentElement.lang=en()?'en':'zh-CN';for(let[n,zh]of labels)n.textContent=en()?n.dataset.en:zh;$('output').placeholder=tr('与原录像同目录','Same folder as the original video');renderVision();showInfo();validate()}
$('lang').value=localStorage.getItem('lol-workbench-language')||'zh';$('lang').onchange=language;
function stamp(s){return Math.floor(s/60)+':'+(s%60).toFixed(3).padStart(6,'0')}
function seconds(value){if(!value.trim())return NaN;let p=value.trim().split(':');if(p.length>3||p.some(x=>!/^\d+(\.\d+)?$/.test(x)))return NaN;return p.reduce((a,b)=>a*60+Number(b),0)}
function showInfo(){$('videoInfo').textContent=media?tr('录像总时长：','Video duration: ')+stamp(media.duration)+' ('+media.duration.toFixed(3)+'s)':''}
function validate(){let start=seconds($('start').value),end=seconds($('end').value),message='';if(media){if(!Number.isFinite(start)||!Number.isFinite(end))message=tr('请输入有效的开始和结束时间。','Enter valid start and end times.');else if(start>=media.duration)message=tr('开始时间必须早于录像结尾。','Start must be before the end of the video.');else if(end<=start)message=tr('结束时间必须晚于开始时间。','End must be after start.');else if(end>media.duration)message=tr('结束时间超过录像总时长，请调整。','End exceeds video duration; adjust the interval.');}$('sample').disabled=busy||!media||!!message;if(!busy)$('status').textContent=message;return !message&&!!media}
$('start').oninput=validate;$('end').oninput=validate;
function handle(fn){return async()=>{try{await fn()}catch(e){$('status').textContent=e.message}}}
async function inspect(){let request=++metadataRequest;media=null;validate();$('videoInfo').textContent=tr('正在读取录像时长…','Reading video duration…');try{let info=await api('/api/video-info',{video:$('videos').value});if(request!==metadataRequest)return;media=info;showInfo();if(!$('end').value)$('end').value=String(Math.floor(info.duration*1000)/1000);if(!$('output').dataset.custom)$('output').value=info.parent;validate()}catch(e){if(request===metadataRequest){$('videoInfo').textContent='';$('status').textContent=e.message}throw e}}
async function list(){media=null;validate();let d=await api('/api/list-videos',{path:$('path').value});$('videos').replaceChildren(...d.videos.map(x=>new Option(x.name,x.path)));if(d.videos.length)await inspect();else{$('videoInfo').textContent='';$('status').textContent=tr('此文件夹没有支持的录像。','No supported videos in this folder.')}}
$('list').onclick=handle(list);$('videos').onchange=handle(inspect);$('output').oninput=()=>{$('output').dataset.custom=$('output').value?'yes':''};
let diskMode='file',diskState=null;
async function browse(path){$('diskError').textContent=tr('正在读取目录…','Reading folder…');try{let d=await api('/api/browse',{path});diskState=d;$('diskPath').value=d.path;$('diskDrive').replaceChildren(new Option(tr('选择磁盘','Choose drive'),''),...d.drives.map(p=>new Option(p,p)));$('diskUp').disabled=!d.parent;$('diskChoose').disabled=!d.path;$('diskEntries').replaceChildren(...d.entries.filter(e=>e.directory||diskMode==='file').map(e=>{let b=document.createElement('button');b.textContent=(e.directory?'▸ ':'▷ ')+e.name;b.onclick=async()=>{try{if(e.directory)await browse(e.path);else{await useSource(e.path);$('diskBrowser').close()}}catch(error){$('diskError').textContent=error.message}};return b}));$('diskError').textContent=''}catch(e){$('diskError').textContent=e.message}}
async function useSource(path){$('path').value=path;await list()}
function openDisk(mode){diskMode=mode;$('diskTitle').textContent=mode==='file'?tr('选择录像文件','Choose video'):mode==='output'?tr('选择保存目录','Choose output folder'):tr('选择录像文件夹','Choose video folder');$('diskChoose').hidden=mode==='file';$('diskBrowser').showModal();browse(mode==='output'?$('output').value:(media?.parent||''))}
$('file').onclick=()=>openDisk('file');$('folder').onclick=()=>openDisk('folder');$('chooseOutput').onclick=()=>openDisk('output');$('diskClose').onclick=()=>$('diskBrowser').close();$('diskDrive').onchange=()=>browse($('diskDrive').value);$('diskUp').onclick=()=>browse(diskState?.parent);$('diskGo').onclick=()=>browse($('diskPath').value);$('diskPath').onkeydown=e=>{if(e.key==='Enter')browse($('diskPath').value)};
$('diskChoose').onclick=handle(async()=>{if(!diskState?.path)return;if(diskMode==='output'){$('output').value=diskState.path;$('output').dataset.custom='yes'}else await useSource(diskState.path);$('diskBrowser').close()});
$('sample').onclick=handle(async()=>{if(!validate())return;busy=true;$('sample').disabled=true;try{let d=await api('/api/sample-start',{video:$('videos').value,start:$('start').value,end:$('end').value,step:Number($('step').value),output_root:$('output').value,use_yolo_auto_annotation:$('useYolo').checked});while(true){let s=await api('/api/sample-status',{job:d.job});if(s.status==='failed')throw Error(s.error);if(s.status==='complete'){location.href='/?token='+encodeURIComponent(token);return}let stages={queued:tr('正在准备…','Preparing…'),probing:tr('正在读取录像信息…','Reading video metadata…'),extracting:tr('FFmpeg 正在生成截图','FFmpeg is generating screenshots'),hashing:tr('截图已生成，正在保存工作区…','Screenshots generated; saving workspace…'),auto_annotation:tr('正在启动自动标注…','Starting automatic annotation…'),loading_models:tr('正在加载 YOLO 模型…','Loading YOLO models…'),tracking_fallback:tr('正在运行基础 Track 候选…','Running basic Track candidates…')};$('status').textContent=(stages[s.stage]||s.stage)+'\n'+(s.frame_count||0)+(s.expected_frames?' / '+s.expected_frames:'')+(s.elapsed_s!=null?tr(' 张，已用 '+s.elapsed_s+' 秒',' frames, '+s.elapsed_s+'s elapsed'):'')+(s.frames_directory?'\n'+s.frames_directory:'');await new Promise(r=>setTimeout(r,600))}}finally{busy=false;validate()}});
language();fetch('/api/setup?token='+encodeURIComponent(token)).then(r=>r.json()).then(d=>{if(!d.ffmpeg||!d.ffprobe)$('status').textContent=tr('未找到 FFmpeg / ffprobe，请安装后重新启动。','FFmpeg / ffprobe missing. Install FFmpeg and restart.');setupVision=d.vision||{};renderVision()}).catch(e=>{$('status').textContent=e.message});
</script></html>
